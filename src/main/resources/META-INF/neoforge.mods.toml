modLoader="javafml"
loaderVersion="[4,)"
license="${mod_license}"

[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    logoFile = "additionaldragons.png"
    #credits=""
    authors="${mod_authors}"
    description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId = "dragonsurvival"
    mandatory = true
    versionRange = "[1.21.1-v2.0.0-beta-28.08.2024,]"
    ordering = "BEFORE"

[[dependencies.${mod_id}]]
    modId = "neoforge"
    mandatory = true
    versionRange = "${neo_version_range}"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
